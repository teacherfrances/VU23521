<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Learning Portal | 15 Modules</title>
    
    <!-- Professional Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-maroon: #631111;    /* Deep Maroon */
            --accent-maroon-light: #8b1a1a;
            --bg-grey: #f2f2f2;         /* Light Grey Background */
            --text-black: #1a1a1a;      /* Matte Black */
            --text-grey: #555555;       /* Muted Grey */
            --card-white: #ffffff;
            --border-grey: #dddddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 12px 30px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-grey);
            color: var(--text-black);
            line-height: 1.6;
            padding-bottom: 100px;
        }

        /* Hero Header */
        header {
            background-color: var(--text-black);
            color: white;
            padding: 80px 24px;
            text-align: center;
            border-bottom: 6px solid var(--accent-maroon);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.1rem;
            color: #999;
            max-width: 700px;
            margin: 0 auto;
        }

        .container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 24px;
        }

        /* The Grid System */
        .learning-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Base Card Styling */
        .card {
            text-decoration: none;
            color: inherit;
            border-radius: 4px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
            background-color: var(--card-white);
        }

        /* Hover Animation */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-maroon);
        }

        /* Main Lesson Override */
        .card.main-lesson {
            background-color: var(--text-black);
            color: #ffffff;
            border: none;
        }

        .card.main-lesson .number {
            color: var(--accent-maroon-light);
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 10px;
        }

        /* Revision Parts Override */
        .card.revision-part .number {
            color: var(--text-black);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .card.revision-part .number span {
            font-size: 0.9rem;
            color: var(--accent-maroon);
            font-weight: 800;
            text-transform: uppercase;
        }

        h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.desc {
            font-size: 0.9rem;
            color: var(--text-grey);
        }

        .main-lesson p.desc {
            color: #888;
        }

        .tag {
            margin-top: auto;
            padding-top: 20px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-maroon);
        }

        .main-lesson .tag {
            color: #999;
        }

        /* Mobile */
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .learning-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Executive Professional Pathway</h1>
        <p>A structured 15-module curriculum for advanced leadership and strategic development.</p>
    </header>

    <div class="container">
        <main class="learning-grid">
            
            <script>
                // Array of 15 Professional Lesson Titles
                const modules = [
                    "Foundations of Leadership", 
                    "Strategic Thinking", 
                    "Operational Excellence",
                    "Financial Acumen", 
                    "Organizational Behavior", 
                    "Market Analysis",
                    "Digital Transformation", 
                    "Crisis Management", 
                    "Ethical Governance",
                    "Innovation Systems", 
                    "Global Logistics", 
                    "Advanced Negotiation", 
                    "Executive Communication",
                    "Talent Development",
                    "Strategic Implementation"
                ];

                const grid = document.querySelector('.learning-grid');

                // Loop to generate 15 Modules (each with 1 main lesson + 2 revisions)
                for (let i = 1; i <= 15; i++) {
                    const title = modules[i-1];
                    const num = i < 10 ? '0' + i : i;

                    // 1. Main Lesson Tile
                    grid.innerHTML += `
                        <a href="#" class="card main-lesson">
                            <div class="number">${num}</div>
                            <h3>${title}</h3>
                            <p class="desc">Core concepts and leadership frameworks defining ${title.toLowerCase()}.</p>
                            <span class="tag">Primary Module</span>
                        </a>
                        
                        <a href="#" class="card revision-part">
                            <div class="number">${i}<span>Part A</span></div>
                            <h3>Revision Session</h3>
                            <p class="desc">Deep-dive analysis and theoretical review of Module ${i} objectives.</p>
                            <span class="tag">Review</span>
                        </a>

                        <a href="#" class="card revision-part">
                            <div class="number">${i}<span>Part B</span></div>
                            <h3>Practical Lab</h3>
                            <p class="desc">Case-study application and workflow exercises for Module ${i}.</p>
                            <span class="tag">Review</span>
                        </a>
                    `;
                }
            </script>

        </main>
    </div>

</body>
</html>
